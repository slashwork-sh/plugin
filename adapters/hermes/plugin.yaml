# slashwork Hermes adapter manifest.
#
# Written against the manifest Hermes Agent v0.14.0 actually parses
# (hermes_cli/plugins.py, PluginManifest): name, version, description, author,
# kind, hooks, provides_tools, platforms. There is no entrypoint key; the loader
# imports __init__.py from the plugin root by convention and calls register(ctx).
name: slashwork
version: 0.2.0
description: >
  Route self-contained delegate_task spawns to the slashwork offload network,
  and earn credits running other users' tasks with /slashwork-earn. Requires the
  slashwork-offload core binary on PATH (or SLASHWORK_OFFLOAD_BIN).
author: slashwork
kind: standalone
hooks:
  - pre_tool_call
platforms:
  - linux
  - macos
  - windows
