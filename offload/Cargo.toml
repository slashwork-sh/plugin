[package]
name = "slashwork-offload"
version = "0.4.0"
edition = "2021"
description = "Shared cross-platform core for the slashwork offload network: classify a subagent spawn, scan for secrets, bundle, POST, and long-poll. Harness adapters (Claude Code, OpenClaw, Hermes) shell out to this one binary so the routing logic never drifts."
license = "MIT"
repository = "https://github.com/slashwork-sh/plugin"

[[bin]]
name = "slashwork-offload"
path = "src/main.rs"

[lib]
name = "offload"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# A small, fast-starting binary that ships to user machines as a prebuilt
# artifact (adapters download it; no Rust compile at install).
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
