# Build and publish the slashwork-offload core binary for every supported
# platform, so the plugins can fetch a prebuilt binary at install time (no Rust
# toolchain on the user's machine). Triggered by pushing a tag like
# `offload-v0.1.0`; plugins/work/hooks/install-core.sh (the slashwork-work
# SessionStart hook) downloads the assets this produces.
name: Release offload binaries

on:
  push:
    tags: ["offload-v*"]

permissions:
  contents: write

jobs:
  # Create the GitHub Release for the tag first. upload-rust-binary-action
  # uploads assets to an existing release, so without this the matrix jobs race
  # to find one and fail with "release not found". One job, no race.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Without this the action rejects the tag: it expects `v<version>`
          # and ours is `offload-v<version>`, so it fails with
          # "invalid tag format 'offload-v0.2.0'" before any binary is built.
          # This job was added after offload-v0.1.0 shipped (upload-rust-binary
          # created the release itself back then), so this path had never
          # actually run until offload-v0.2.0 was cut.
          prefix: offload
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows ships x86_64 only. Windows on ARM runs x64 binaries under
          # emulation, so one asset serves both and resolve_target maps every
          # Windows arch here; building aarch64-pc-windows-msvc as well would
          # add a cross-compile that `ring` cannot do on a stock runner for a
          # machine class that does not need its own binary.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Builds the release binary for the target (cross-compiling via `cross`
      # for the Linux targets when the host differs), tars it as
      # slashwork-offload-<target>.tar.gz with a .sha256 alongside, and uploads
      # both to the release for the pushed tag.
      #
      # `tar: all` / `zip: none` overrides the action's default of zipping
      # Windows targets. The installers fetch one asset name shape
      # (slashwork-offload-<target>.tar.gz) on every platform, and Git Bash
      # ships tar, so keeping the format uniform means the Windows path needs
      # no second extract branch.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: slashwork-offload
          target: ${{ matrix.target }}
          manifest-path: offload/Cargo.toml
          archive: slashwork-offload-$target
          checksum: sha256
          tar: all
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}
