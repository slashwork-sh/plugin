name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck plugin scripts
        run: shellcheck plugins/work/hooks/*.sh plugins/earn/hooks/*.sh offload/dist/install.sh
      - name: Submit hook integration test
        run: bash plugins/earn/hooks/submit_test.sh
      - name: Intercept hook integration test
        run: bash plugins/work/hooks/intercept_test.sh
      - name: Core installer platform resolver test
        run: bash plugins/work/hooks/install-core_test.sh
      - name: Standalone core installer test
        run: bash offload/dist/install_test.sh
      - name: Earn listener integration test
        run: bash plugins/earn/hooks/earn-listen_test.sh
      - name: Validate marketplace and plugin manifests
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/work/.claude-plugin/plugin.json
          jq empty plugins/earn/.claude-plugin/plugin.json

  offload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offload
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy (pedantic)
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: Test
        run: cargo test

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the adapter
        run: python -m py_compile adapters/hermes/__init__.py adapters/hermes/test_hermes.py
      - name: Unit tests
        run: python -m unittest adapters/hermes/test_hermes.py
      - name: Validate the plugin manifest
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('adapters/hermes/plugin.yaml'))"

  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the package and plugin manifests
        run: |
          jq empty adapters/openclaw/package.json
          jq empty adapters/openclaw/openclaw.plugin.json
          # OpenClaw reads openclaw.plugin.json before loading any plugin code,
          # and resolves the entry from package.json#openclaw.extensions. A
          # missing id or entry is a plugin that never loads.
          jq -e '.id == "slashwork"' adapters/openclaw/openclaw.plugin.json > /dev/null
          jq -e '.openclaw.extensions | index("./plugin.js")' adapters/openclaw/package.json > /dev/null
      - name: Unit tests
        run: node --test adapters/openclaw/index.test.js

  # The offloader shipped broken on Windows for its whole life and nobody
  # noticed, because every other job here runs on Linux. This one runs the real
  # Windows path: Git Bash, the cross-compiled .exe, and the shim driving it.
  #
  # `shell: bash` on a windows runner IS Git Bash, which is also what Claude
  # Code uses for command hooks on native Windows, so this exercises the same
  # interpreter a user gets.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: offload

      # Pure resolver checks, no network. Confirms the real `uname -s` on this
      # machine maps to a target rather than falling through to unsupported,
      # which is the bug that made the offloader inert here.
      - name: Platform resolver
        run: |
          echo "uname -s: $(uname -s)  uname -m: $(uname -m)"
          bash plugins/work/hooks/install-core_test.sh
          SLASHWORK_INSTALL_LIB=1 . plugins/work/hooks/install-core.sh
          target=$(resolve_target "$(uname -s)" "$(uname -m)") \
            || { echo "this runner's platform does not resolve"; exit 1; }
          [ "$target" = "x86_64-pc-windows-msvc" ] || { echo "wrong target: $target"; exit 1; }
          [ "$(bin_name "$target")" = "slashwork-offload.exe" ] || { echo "wrong bin name"; exit 1; }

      # Build from this commit rather than trusting the released artifact, so a
      # source change that breaks Windows fails here instead of at the next tag.
      - name: Build the core
        run: cargo build --manifest-path offload/Cargo.toml --bin slashwork-offload

      - name: Core test suite
        run: cargo test --manifest-path offload/Cargo.toml

      # The binary has to actually execute. Everything above would pass on a
      # cross-compiled artifact that cannot run.
      - name: The .exe runs and answers `hook`
        run: |
          CORE="offload/target/debug/slashwork-offload.exe"
          [ -x "$CORE" ] || { echo "no .exe at $CORE"; exit 1; }
          # Capture before grepping. A bare invocation prints usage and exits
          # non-zero on purpose, and this step runs under `-o pipefail`, so
          # piping it straight into grep fails the step on the binary's exit
          # code even when the output is exactly right.
          usage=$("$CORE" 2>&1 || true)
          printf '%s' "$usage" | grep -q 'usage:' \
            || { echo "binary did not run, output was: $usage"; exit 1; }
          # A non-subagent envelope: valid input, no output, clean exit.
          out=$(printf '%s' '{"tool_name":"Bash","tool_input":{"prompt":"ls"}}' | "$CORE" hook)
          [ -z "$out" ] || { echo "expected no output, got: $out"; exit 1; }

      # The full hook path under Git Bash, which is where it used to die on jq.
      # No network: the consent gate returns before any dispatch, and the second
      # call dispatches at an unreachable base and must fall through silently.
      - name: The shim routes end to end
        env:
          SLASHWORK_TOKEN: fake-token-for-ci
          SLASHWORK_BASE_URL: http://localhost:9
        run: |
          export SLASHWORK_OFFLOAD_BIN="$PWD/offload/target/debug/slashwork-offload.exe"
          export TMPDIR="$(mktemp -d)"
          # Consent is recorded per user, in the state dir, so HOME is what makes
          # this step hermetic (TMPDIR alone did when the marker was per session).
          export HOME="$TMPDIR" USERPROFILE="$TMPDIR"
          export SLASHWORK_ROUTE_LOG="$TMPDIR/route.jsonl"
          ENV='{"session_id":"ci-win","tool_name":"Task","tool_input":{"prompt":"Research and compare the leading rate-limiting approaches; give the pros and cons of each."}}'

          first=$(printf '%s' "$ENV" | bash plugins/work/hooks/intercept.sh)
          printf '%s' "$first" | grep -q 'slashwork intercept is on' \
            || { echo "no consent disclosure on the first routable spawn: $first"; exit 1; }

          second=$(printf '%s' "$ENV" | bash plugins/work/hooks/intercept.sh)
          [ -z "$second" ] || { echo "unreachable coordinator should be silent, got: $second"; exit 1; }

          # One entry per call is the invariant. Asserting the consent call's
          # exact decision string would couple this step to how that path is
          # labelled, which is changing separately.
          [ "$(grep -c '"decision"' "$SLASHWORK_ROUTE_LOG")" -eq 2 ] \
            || { echo "expected one route-log entry per call: $(cat "$SLASHWORK_ROUTE_LOG")"; exit 1; }
          grep -q '"decision":"local"'  "$SLASHWORK_ROUTE_LOG" || { echo "route log missing local"; exit 1; }

      - name: Shim contract tests
        run: bash plugins/work/hooks/intercept_test.sh

      # The published installer, on a real Windows machine: resolve, download,
      # verify the checksum, extract, and land an .exe that runs. This is the
      # step a user's SessionStart hook takes.
      - name: Published installer
        run: |
          bash plugins/work/hooks/install-core.sh
          BIN="$HOME/.slashwork/bin/slashwork-offload.exe"
          [ -x "$BIN" ] || { echo "installer did not land an .exe at $BIN"; ls -la "$HOME/.slashwork/bin" || true; exit 1; }
          pinned=$(grep -m1 '^VERSION=' plugins/work/hooks/install-core.sh | cut -d'"' -f2)
          got=$(cat "$HOME/.slashwork/bin/.version")
          [ "$got" = "$pinned" ] || { echo "version marker $got != pinned $pinned"; exit 1; }
          "$BIN" goal 30m | grep -q '"seconds":1800' || { echo "installed binary did not run"; exit 1; }
          # Idempotent: a second run must not redownload.
          bash plugins/work/hooks/install-core.sh
